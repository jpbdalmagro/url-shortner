<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background circle with dark slate fill -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Glowing chain link icon -->
  <g filter="url(#glow)" stroke="url(#grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-right link loop -->
    <path d="M 28 20 L 36 12 C 41 7, 49 7, 54 12 C 59 17, 59 25, 54 30 L 46 38" />
    <!-- Bottom-left link loop -->
    <path d="M 36 44 L 28 52 C 23 57, 15 57, 10 52 C 5 47, 5 39, 10 34 L 18 26" />
    <!-- Center connecting diagonal -->
    <line x1="26" y1="38" x2="38" y2="26" />
  </g>
</svg>

