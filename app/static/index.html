<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem;
    }

    /* Animated gradient blobs in background */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      animation: float 8s ease-in-out infinite alternate;
    }
    body::before {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #7c3aed, #3b82f6);
      top: -80px; left: -100px;
    }
    body::after {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #06b6d4, #8b5cf6);
      bottom: -60px; right: -80px;
      animation-delay: -4s;
    }
    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* Glass card */
    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    /* Title */
    .card h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }
    .card h1 span { margin-right: .4rem; }

    /* Input */
    .input-wrap { position: relative; margin-bottom: 1rem; }
    .input-wrap input {
      width: 100%;
      padding: .875rem 1.25rem;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.35); }
    .input-wrap input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,.25);
    }

    /* Shorten button */
    .btn-shorten {
      width: 100%;
      padding: .9rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(124,58,237,.45);
      letter-spacing: .3px;
    }
    .btn-shorten:hover:not(:disabled) { opacity: .92; transform: translateY(-1px); }
    .btn-shorten:active:not(:disabled) { transform: translateY(0); }
    .btn-shorten:disabled { opacity: .55; cursor: not-allowed; }

    /* Loading spinner inside button */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: .5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result card */
    .result {
      margin-top: 1.25rem;
      display: none;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      overflow: hidden;
      animation: slideIn .3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-url {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .875rem 1.25rem;
      gap: 1rem;
    }
    .result-url a {
      color: #34d399;
      font-family: 'Courier New', monospace;
      font-size: .95rem;
      word-break: break-all;
      text-decoration: none;
      transition: color .2s;
    }
    .result-url a:hover { color: #6ee7b7; }

    .btn-copy {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem .9rem;
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      color: #cbd5e1;
      font-size: .825rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
    }
    .btn-copy:hover { background: rgba(52,211,153,.12); border-color: #34d399; color: #34d399; }
    .btn-copy.copied { background: rgba(52,211,153,.2); border-color: #34d399; color: #34d399; }

    /* Divider */
    .result-divider { height: 1px; background: rgba(255,255,255,0.08); }

    /* Stats bar */
    .result-stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .65rem 1.25rem;
      color: rgba(255,255,255,0.4);
      font-size: .825rem;
    }
    .result-stats svg { opacity: .6; }

    /* Error message */
    .error-msg {
      display: none;
      margin-top: 1rem;
      padding: .75rem 1rem;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 12px;
      color: #fca5a5;
      font-size: .875rem;
      text-align: center;
      animation: slideIn .3s ease;
    }
  </style>
</head>
<body>

<div class="card">
  <h1><span>🔗</span>URL Shortener</h1>

  <div class="input-wrap">
    <input
      id="urlInput"
      type="url"
      placeholder="https://sua-url-longa.com/aqui..."
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <button class="btn-shorten" id="btnShorten" onclick="shorten()">
    Encurtar
  </button>

  <!-- Result -->
  <div class="result" id="result">
    <div class="result-url">
      <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
      <button class="btn-copy" id="btnCopy" onclick="copy()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copiar
      </button>
    </div>
    <div class="result-divider"></div>
    <div class="result-stats">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span id="clicksText">0 cliques</span>
      <span style="opacity:.4">·</span>
      <span id="createdText">agora mesmo</span>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
  const API = '';  // mesma origem

  const urlInput  = document.getElementById('urlInput');
  const btnShorten = document.getElementById('btnShorten');
  const resultEl  = document.getElementById('result');
  const shortLink = document.getElementById('shortLink');
  const btnCopy   = document.getElementById('btnCopy');
  const clicksText = document.getElementById('clicksText');
  const createdText = document.getElementById('createdText');
  const errorMsg  = document.getElementById('errorMsg');

  // Allow Enter key
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });

  async function shorten() {
    const url = urlInput.value.trim();
    if (!url) { showError('Por favor, cole uma URL antes de continuar.'); return; }

    // Loading state
    btnShorten.disabled = true;
    btnShorten.innerHTML = '<span class="spinner"></span>Encurtando…';
    resultEl.style.display = 'none';
    errorMsg.style.display = 'none';

    try {
      const res = await fetch(`${API}/urls/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Erro ${res.status}`);
      }

      const data = await res.json();

      // Show result
      shortLink.href = data.short_url;
      shortLink.textContent = data.short_url;

      // Stats
      clicksText.textContent = '0 cliques';
      if (data.created_at) {
        const d = new Date(data.created_at);
        createdText.textContent = `criado ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
      }

      resultEl.style.display = 'block';
      btnCopy.classList.remove('copied');
      btnCopy.innerHTML = `
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>Copiar`;

      // Fetch stats after a short delay
      setTimeout(() => fetchStats(data.short_code), 600);

    } catch (err) {
      showError(err.message);
    } finally {
      btnShorten.disabled = false;
      btnShorten.textContent = 'Encurtar';
    }
  }

  async function fetchStats(code) {
    try {
      const res = await fetch(`${API}/urls/${code}/stats`);
      if (!res.ok) return;
      const data = await res.json();
      clicksText.textContent = `${data.clicks} ${data.clicks === 1 ? 'clique' : 'cliques'}`;
    } catch (_) {}
  }

  async function copy() {
    const text = shortLink.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      // Fallback para navegadores mais antigos
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btnCopy.classList.add('copied');
    btnCopy.innerHTML = `
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>Copiado!`;
    setTimeout(() => {
      btnCopy.classList.remove('copied');
      btnCopy.innerHTML = `
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>Copiar`;
    }, 2200);
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
</script>

</body>
</html>
